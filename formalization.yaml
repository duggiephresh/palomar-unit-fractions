    type: "article"
    location: "Fibonacci Quarterly 33 (1995)"
    relationship: background
    note: "States that no solution with all terms odd is known, for either the proper or the improper system."
  - title: "On recursive solutions of a unit fraction equation"
    authors:
      - "Lawrence Brenton"
      - "Ana Bruner"
    type: "article"
    location: "Journal of the Australian Mathematical Society 57 (1994), 341–356"
    relationship: background
    note: "Sylvester chains tracked modulo primes: an earlier instance of certifying unwritten solutions by residues."

related_formalizations: []

status:
  scope: >-
    Both Challenge statements are proved in full, with no weakened hypotheses. Theorem 1 is the exact
    formal-conjectures statement of the coprime 1-excluded variant. Theorem 2 asserts at least two odd elements;
    the witness has 24. The prime version of Erdős #307 and odd primary pseudoperfect numbers (the prime case of
    Znám's problem) are not addressed.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        Lean 4 v4.36.0 with Mathlib v4.36.0 (lake build, decide +kernel, #print axioms); Python with gmpy2 for the
        verifiers; C for the beam searches. The agent wrote the Lean library (forcing reduction, closing lemma,
        implicit-chain step lemma, residue checker and its soundness proof), the certificate encoding, the Znám
        kernel check and one of the two independent verifiers.
      cost:
        wall_time: "about 3 days of agent sessions"
        spend_usd: "subscription-based"
        hardware: "local machine (Apple silicon laptop)"
      prompting_notes: "The human set goals and routes; the agents proposed, ran and checked the mathematics."
    - method: agent
      models: ["claude-opus-5-5"]
      framework: "Claude Code (separate session)"
      tool_setup: "C residue-only beam search that found both witnesses; a second independent Python verifier."
      cost:
        wall_time: "hours"
        spend_usd: "subscription-based"
        hardware: "local machine (Apple silicon laptop)"
      prompting_notes: "Written briefs from the main session."
  spend_usd: "subscription-based"
  notes: >-
    Directed by Doug Phillips. Claude agents did the search, the formalization and the independent verification.
    Earlier rounds of the surrounding project, not part of this submission, also used Gemini (Google).

fidelity:
  divergences: >-
    None for Theorem 1. Theorem 2 encodes Znám's proper condition as x ∣ (∏_{y≠x} y) + 1 and x ≠ (∏_{y≠x} y) + 1
    over a Finset of naturals, which is the standard statement restricted to odd elements greater than 1.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    Statements audited by hand against formal-conjectures and the Brenton–Hill definition. Witnesses re-checked by
    two independently written verifiers and, for Znám, by direct big-integer arithmetic in Python and PARI/GP. No
    external mathematical review yet.

alignment:
  namespace: "UnitFractions"
  statements:
    - source: "formal-conjectures erdos_307.variants.coprime_one_notMem"
      lean: "UnitFractions.erdos307_coprime_one_notMem"
      module: "Challenge"
      status: proved
      note: "Same hypotheses and conclusion as the formal-conjectures statement."
    - source: "Znám's problem with all terms odd (no example known per Brenton–Joo 1995)"
      lean: "UnitFractions.odd_znam"
      module: "Challenge"
      status: proved
      note: "Existence of a set of at least two odd integers greater than 1 satisfying Znám's proper condition."

acknowledgements: "Mathlib; the formal-conjectures project; erdosproblems.com; Stijn Cambie's examples of the 1-allowed variant; V. Bonfioli's bounds for the coprime variant."
