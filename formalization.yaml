    type: "article"
    location: "Pacific Journal of Mathematics 133 (1988), 41–67"
    relationship: background
    note: "Source of the 'sequence of remainders' step that the method iterates, and of the bound that an all-odd solution needs at least 12 terms."
  - title: "On the system of congruences ∏_{j≠i} nⱼ ≡ 1 mod nᵢ"
