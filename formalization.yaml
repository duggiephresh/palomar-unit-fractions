# formalization.yaml v0.4
version: "v0.4"

project:
  name: "An odd solution of Znám's problem and a solution of the coprime variant of Erdős Problem #307"
  description: >-
    Two existence theorems on unit fractions, each checked by the Lean kernel from an explicit or implicit witness.
    (1) The coprime variant of Erdős Problem #307 with 1 excluded: finite sets P, Q of integers greater than 1, each
    pairwise coprime, with (Σ_{p∈P} 1/p)(Σ_{q∈Q} 1/q) = 1. The statement is formal-conjectures'
    erdos_307.variants.coprime_one_notMem, listed there and on erdosproblems.com as having no known examples. The
    witness has 973 elements, most too large to write down. It is encoded by 914 small "deviations" and certified by
    a residue checker whose soundness is proved in Lean.
    (2) An all-odd solution of Znám's problem: 24 odd integers greater than 1, each a proper divisor of the product of
    the others plus 1. No all-odd solution was known (Brenton and Joo, 1995).
    Production: the results, the search programs and this Lean formalization were produced by AI agents (Claude,
    Anthropic) in a project run by Doug Phillips. He set the goals, directed the work and is responsible for this
    entry, but he did not independently verify the mathematics. Correctness of the stated theorems rests on the
    kernel checks recorded here. No human mathematician has yet reviewed the work.
  authors:
    - "Doug Phillips"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Doug Phillips"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11D68", "11Y50"]

