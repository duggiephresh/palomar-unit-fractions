version: "0.4"
project:
  name: "An odd solution of Znám's problem and a solution of the coprime variant of Erdős #307"
  description: >-
    Two existence theorems, each proved by an explicit or implicit witness checked by the Lean kernel
    (decide +kernel, standard axioms only, no native_decide).
    (1) Erdős Problem #307, coprime variant with 1 ∉ P ∪ Q: pairwise-coprime finite P, Q with
    (Σ_P 1/p)(Σ_Q 1/q) = 1. The statement copies google-deepmind/formal-conjectures
    `erdos_307.variants.coprime_one_notMem` (research open, "no examples known"). The witness has 973
    elements, given implicitly by 914 deviations and certified by a residue checker proved sound in Lean.
    (2) A set of 24 odd integers > 1, each a proper divisor of the product of the others plus 1: an all-odd
    solution of Znám's problem (Brenton–Hill 1988, open question).
  authors: ["Doug Phillips"]                  # TODO-DOUG: confirm (humans only)
  license: "Apache-2.0"
  responsible_maintainers: ["Doug Phillips"]  # TODO-DOUG
